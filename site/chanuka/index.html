<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>נרות לכל השכונה</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Secular+One&display=swap"><style>
:root{--bg:#2a1b5e;--fg:#fff;--acc:#ff8f1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1245}}
:root[data-theme="dark"]{--bg:#1c1245}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Rubik',system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
#app{position:relative;height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
#hud{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:19px;font-weight:700;background:#3d2a85}
#stage{position:relative;flex:1;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;
 background:linear-gradient(#2a1b5e 0%,#6b3a9c 30%,#ff9a62 52%,#ffd08a 54%,#a8754f 54%,#8d6040 100%)}
#moon{position:absolute;top:8px;left:14px;font-size:34px}
#houses{position:absolute;top:44px;left:0;right:0;display:flex;flex-wrap:wrap;gap:7px;justify-content:center;padding:0 10px}
.h{width:24px;height:28px;background:linear-gradient(#7b5bb5,#4d3585);border-radius:5px 5px 0 0;position:relative;box-shadow:inset -3px -3px 5px rgba(0,0,0,.25)}
.h::before{content:"";position:absolute;left:7px;top:8px;width:10px;height:12px;background:#2b2150;border-radius:2px}
.h.on::before{background:#ffe066;box-shadow:0 0 12px 4px #ffd54a}
.h.on::after{content:"🕯️";position:absolute;top:-16px;left:4px;font-size:14px}
.p{position:absolute;left:0;top:0;width:50px;height:90px;transform-origin:bottom center;cursor:pointer}
.p>.in{position:absolute;inset:0;animation:bob .35s infinite alternate ease-in-out}
.p.f>.in{animation-duration:.2s}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes step{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.sh{position:absolute;bottom:-5px;left:1px;width:48px;height:13px;border-radius:50%;background:rgba(40,20,10,.35);filter:blur(2px)}
.lg{position:absolute;bottom:6px;left:14px;width:10px;height:26px;border-radius:5px;background:linear-gradient(90deg,#3b4d8f,#1f2a5a);transform-origin:top;animation:step .4s infinite alternate}
.lg.r{left:27px;animation-direction:alternate-reverse}
.p.f .lg{animation-duration:.2s}
.bd{position:absolute;left:8px;top:34px;width:34px;height:38px;border-radius:15px 15px 8px 8px;
 background:radial-gradient(circle at 30% 22%,color-mix(in srgb,var(--shirt) 55%,#fff),var(--shirt) 55%,color-mix(in srgb,var(--shirt) 60%,#000));box-shadow:inset -5px -6px 9px rgba(0,0,0,.28)}
.hd{position:absolute;left:8px;top:4px;width:34px;height:34px;border-radius:50%;
 background:radial-gradient(circle at 32% 28%,#fff9,var(--skin) 40%,color-mix(in srgb,var(--skin) 60%,#000));box-shadow:inset -4px -5px 8px rgba(0,0,0,.25)}
.hd::before{content:"";position:absolute;left:10px;top:14px;width:5px;height:6px;border-radius:50%;background:#222;box-shadow:11px 0 #222}
.hd::after{content:"";position:absolute;left:11px;top:22px;width:12px;height:6px;border-bottom:2.5px solid #8a2f2f;border-radius:0 0 12px 12px}
.ht{position:absolute;left:10px;top:2px;width:30px;height:15px;border-radius:15px 15px 4px 4px;background:radial-gradient(circle at 30% 20%,#fff6,var(--hat) 50%,#0006);box-shadow:inset -3px -3px 5px rgba(0,0,0,.3)}
.cat{position:absolute;inset:0;font-size:46px;line-height:1;filter:drop-shadow(3px 6px 3px rgba(0,0,0,.35));animation:bob .3s infinite alternate}
.say{position:absolute;white-space:nowrap;background:#fff;color:#3a2a10;font-size:18px;font-weight:700;padding:6px 14px;border-radius:14px;pointer-events:none;transition:transform .7s,opacity .7s;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#brand{display:flex;align-items:center;gap:8px;justify-content:center;padding:6px;background:#2a1b5e;font-family:'Secular One','Rubik',system-ui,sans-serif;font-size:22px;font-weight:400;letter-spacing:.3px;text-shadow:0 2px 6px rgba(0,0,0,.4);color:#ffd54a;border-bottom:2px solid #ffd54a}
#brand b{font-size:24px}
#foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:#3d2a85;font-family:'Rubik','Heebo',system-ui,sans-serif;font-weight:500;font-size:15px;line-height:1.45}
#foot .ft{flex:1;text-align:center}
#wa,#don{flex:1;align-self:stretch;display:flex;align-items:center;justify-content:center;text-align:center;padding:9px 8px;border-radius:12px;font-weight:700;font-size:14px;line-height:1.25;text-decoration:none}
#wa{background:#25d366;color:#fff}
#don{background:#ffd54a;color:#3a2a10}
#ord{display:none;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:6px 8px;background:#ff8f1f;color:#3a2a10;font-weight:700;font-size:15px;font-family:'Rubik',system-ui,sans-serif}
#ord .ab{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#ord button{font-size:15px;padding:7px 12px;border-radius:10px;background:#fff;color:#3a2a10;box-shadow:0 2px 0 #b85c00}
.tg{position:absolute;top:-20px;left:-14px;white-space:nowrap;background:#ffd54a;color:#3a2a10;font-size:12px;font-weight:700;padding:2px 7px;border-radius:8px}
#foot a{display:inline-block;margin-top:4px;padding:6px 16px;border-radius:12px;background:#25d366;color:#fff;font-weight:700;text-decoration:none}
#mu{padding:2px 8px;font-size:22px;box-shadow:none;background:transparent}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(80,40,140,.78);backdrop-filter:blur(3px);z-index:50;padding:20px}
#card{background:linear-gradient(#5b3fa8,#8a4fb8);border:3px solid #ffd54a;border-radius:22px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;max-width:340px}
#card h1{margin:0;font-size:30px}#card p{margin:0;line-height:1.5}
button{font:inherit;font-size:20px;font-weight:700;padding:11px 30px;border:0;border-radius:14px;background:var(--acc);color:#fff;cursor:pointer;box-shadow:0 4px 0 #b85c00}
</style>
</head>
<body>
<div id="app">
 <div id="hud"><span id="lv"></span><span id="hp"></span><span id="sc"></span></div>
 <div id="stage"><div id="moon">🌙</div><div id="houses"></div><div id="ov"><div id="card"></div></div></div>
</div>
<script>
const $=id=>document.getElementById(id), st=$('stage'), ov=$('ov'), card=$('card');
let level=1,lives=3,lit=0,goal=8,run=false,cs=[],last=0,spawnT=0,best=0;
try{best=+localStorage.getItem('chanukahBest')||0}catch(e){}
const SKIN=['#f2c9a0','#e0a878','#b9774b','#8a5a3a'],SHIRT=['#e63946','#2a9d8f','#f4a261','#4361ee','#c77dff','#80b918'],HAT=['#222','#1d3557','#6a4c93','#9d0208'];
const SAY=['תודה, אלופים!','סוף סוף אור!','איפה הסופגניה?','חג שמח!','וואו, איזה נר!','בדיוק חיפשתי!','שמש, אתה גדול!','יש גם סביבון?','אמא תתגאה בך!','עכשיו זה חג!','נס גדול היה פה!','סוף סוף רואים סלון!','יש לי גפרור, נשמה!','אור גדול לשכונה!','אפילו החתול התרשם!','אני מביא סופגניה!','השכנים כבר מתחרים!'];
const LANES=[{f:.66,s:1},{f:.79,s:1.25},{f:.94,s:1.5}];
const R=a=>a[Math.floor(Math.random()*a.length)];
let AC=null,musicOn=true,mTimer=0,bus=null;
const MEL=[[7,.5],[7,.5],[8,.5],[7,.5],[5,1],[4,.5],[5,.5],[7,2],[7,.5],[8,.5],[10,.5],[8,.5],[7,1],[5,.5],[4,.5],[5,2],[4,.5],[5,.5],[7,.5],[5,.5],[4,1],[1,.5],[0,.5],[1,1],[4,1],[5,1],[4,.5],[1,.5],[0,2],[null,1]];
const fq=n=>293.66*Math.pow(2,n/12);
function tone(f,t,d,v,type,dest){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(dest||AC.destination);o.start(t);o.stop(t+d+.05)}
function music(){
 if(!AC||!musicOn)return;
 if(bus)bus.disconnect();
 bus=AC.createGain();bus.gain.value=.5;bus.connect(AC.destination);
 let t=AC.currentTime+.05;const B=.34;
 for(const [n,b] of MEL){if(n!==null){tone(fq(n),t,b*B*2.2,.16,'triangle',bus);tone(fq(n+12),t,b*B*1.5,.05,'sine',bus)}t+=b*B}
 mTimer=setTimeout(music,Math.max(100,(t-AC.currentTime)*1000-80));
}
function audioOn(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();if(!mTimer&&musicOn)music()}catch(e){}}
function toggleMusic(){musicOn=!musicOn;$('mu').textContent=musicOn?'🔊':'🔇';clearTimeout(mTimer);mTimer=0;if(musicOn){audioOn()}else if(bus){bus.disconnect();bus=null}}
function sfx(k){if(!AC||!musicOn)return;const t=AC.currentTime;
 if(k==='ding'){tone(880,t,.18,.25,'sine');tone(1318,t+.08,.3,.25,'sine')}
 else if(k==='bad'){tone(220,t,.25,.2,'square');tone(150,t+.12,.3,.2,'square')}
 else if(k==='meow'){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(900,t);o.frequency.linearRampToValueAtTime(500,t+.35);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.45)}
 else if(k==='win'){[0,4,7,12].forEach((n,i)=>tone(fq(n+12),t+i*.12,.35,.2,'triangle'))}}
function hud(){$('lv').textContent='שלב '+level;$('hp').textContent='❤️'.repeat(Math.max(lives,0))||'💔';$('sc').textContent='🕯️ '+lit+'/'+goal}
function houses(){$('houses').innerHTML=Array.from({length:goal},(_,i)=>'<div class="h'+(i<lit?' on':'')+'"></div>').join('')}
function show(html,btn,fn){card.innerHTML=html+'<button id="go">'+btn+'</button>';ov.style.display='flex';$('go').onclick=()=>{ov.style.display='none';audioOn();fn()}}
function say(x,y,t){const d=document.createElement('div');d.className='say';d.textContent=t;d.style.left=Math.max(4,Math.min(x-30,st.clientWidth-200))+'px';d.style.top=Math.max(4,y)+'px';st.appendChild(d);
 setTimeout(()=>{d.style.transform='translateY(-28px)';d.style.opacity='0'},1900);setTimeout(()=>d.remove(),2700)}
let order=null,orderT=0;
const ADDR=['יערות הכרמל 20','יער עמינדב 17','יער ביריה 4'];
function takeOrder(c){order=R(ADDR);orderT=12;sfx('ding');say(c.x,c.y+54-90*c.s,'📦 משלוח נרות!');showOrder()}
function showOrder(){const o=$('ord');if(!order){o.style.display='none';return}o.style.display='flex';o.innerHTML='<div>📦 משלוח נרות ל: <b>'+order+'</b></div><div class="ab">'+ADDR.map(a=>'<button data-a="'+a+'">'+a+'</button>').join('')+'</div>';o.querySelectorAll('button').forEach(b=>b.onpointerdown=e=>{e.preventDefault();deliver(b.dataset.a)})}
function deliver(a){if(!run||!order)return;const x=st.clientWidth/2-70,y=st.clientHeight*.3;if(a===order){order=null;showOrder();sfx('win');say(x,y,'המשלוח הגיע! 🎉');lit=Math.min(goal,lit+1);hud();houses();if(lit>=goal)win()}else{sfx('bad');say(x,y,'זו לא הכתובת!')}}
function hit(q){lives--;hud();if(!q)sfx('bad');if(lives<=0)end()}
function kill(c){c.el.remove();cs=cs.filter(o=>o!==c)}
function spawn(){
 const H=st.clientHeight,li=Math.floor(Math.random()*3),L=LANES[li],r=Math.random(),type=r<.15?'cat':r<.4?'fast':(r<.48&&level>=2)?'sufg':(r<.55&&level>=3&&!order)?'box':'walk';
 const el=document.createElement('div');el.className='p'+(type==='fast'?' f':'');el.style.zIndex=10+li;
 if(type==='cat'||type==='sufg'||type==='box')el.innerHTML='<i class="sh"></i><div class="cat">'+({cat:'🐈',sufg:'🍩',box:'📦'})[type]+'</div>'+(type==='sufg'?'<span class="tg">פיצוחי מזוז</span>':'');
 else el.innerHTML='<i class="sh"></i><div class="in" style="--skin:'+R(SKIN)+';--shirt:'+R(SHIRT)+';--hat:'+R(HAT)+'"><b class="lg"></b><b class="lg r"></b><u class="bd"></u><s class="hd"></s><em class="ht"></em></div>';
 const c={el,type,s:type==='fast'?L.s*.9:L.s,x:st.clientWidth+30,y:H*L.f-90,taps:type==='fast'?2:1,v:(70+level*16)*(type==='fast'?1.7:1)*(.85+Math.random()*.3)};
 el.onpointerdown=e=>{e.preventDefault();if(!run)return;
  if(type==='sufg'){lives=Math.min(3,lives+1);hud();say(c.x,c.y+54-90*c.s,'סופגניה מפיצוחי מזוז! 🍩');sfx('ding');kill(c);return}
  if(type==='box'){takeOrder(c);kill(c);return}
  if(type==='cat'){say(c.x,c.y+54-90*c.s,'המיאו! הפיל נרות 💔');sfx('meow');kill(c);hit(true);return}
  if(--c.taps>0){el.style.opacity='.65';return}
  say(c.x,c.y+54-90*c.s,R(SAY));sfx('ding');kill(c);lit++;hud();houses();
  if(lit>=goal)win()};
 st.appendChild(el);cs.push(c);
}
function loop(t){
 if(!run)return;
 const dt=Math.min((t-last)/1000,.05);last=t;spawnT-=dt;if(order){orderT-=dt;if(orderT<=0){order=null;showOrder()}}
 if(spawnT<=0){spawn();spawnT=Math.max(.45,1.25-level*.1)}
 for(const c of [...cs]){c.x-=c.v*dt;c.el.style.transform='translate('+c.x+'px,'+c.y+'px) scale('+c.s+')';
  if(c.x<-80){kill(c);if(c.type==='walk'||c.type==='fast')hit()}}
 if(run)requestAnimationFrame(loop);
}
function clear(){run=false;order=null;showOrder();cs.forEach(c=>c.el.remove());cs=[]}
function startLevel(){goal=Math.min(14,6+level*2);lit=0;spawnT=.3;run=true;hud();houses();last=performance.now();requestAnimationFrame(loop)}
function win(){clear();sfx('win');show('<h1>🎉 כל השכונה דולקת!</h1><p>שלב '+level+' הושלם. חג חנוכה שמח!</p>','לשכונה הבאה',()=>{level++;startLevel()})}
function end(){clear();if(level>best){best=level;try{localStorage.setItem('chanukahBest',best)}catch(e){}}
 show('<h1>כל הכבוד! 🌟</h1><p>תמיד אפשר עוד! המטרה: שלא יישאר יהודי אחד בשכונה בלי נרות.</p><p>הגעת לשלב '+level+'.<br>שיא: שלב '+best+'</p>','עוד פעם',newGame)}
function newGame(){level=1;lives=3;startLevel()}
const CONTACT='972587602018';const DONATE='https://shutaf.im/nbs';
(function(){const a=$('app'),b=document.createElement('div');b.id='brand';b.innerHTML='<b>🕎</b><span>בית חבד נופי בן שמן</span>';a.prepend(b);
 const f=document.createElement('div');f.id='foot';f.innerHTML='מכירים שכן בלי נרות? נשמח לעזור לכם לחלק נרות חנוכה'+(CONTACT?'<br><a href="https://wa.me/'+CONTACT+'?text='+encodeURIComponent('אני צריך נרות')+'" target="_blank" rel="noopener">פנו אלינו בוואטסאפ</a>':'');f.innerHTML=(CONTACT?'<a id="wa" href="https://wa.me/'+CONTACT+'?text='+encodeURIComponent('אני צריך נרות')+'" target="_blank" rel="noopener">🕯️ שכן בלי נרות? פנו אלינו</a>':'')+(DONATE?'<a id="don" href="'+DONATE+'" target="_blank" rel="noopener">💛 תרמו לבית חב״ד</a>':'');a.appendChild(f);
 const m=document.createElement('button');m.id='mu';m.textContent='🔊';m.onclick=toggleMusic;$('hud').appendChild(m)})();
const od=document.createElement('div');od.id='ord';$('app').insertBefore(od,$('foot'));
show('<h1>🕎 נרות לכל השכונה</h1><p>חנוכה הגיע והשכנים בלי נרות! לוחצים על כל שכן שעובר כדי לתת לו נר ולהדליק לו את הבית. ילד רץ דורש שתי לחיצות. לא נוגעים בחתול 🐈, הוא מפיל נרות! שכן שעבר בלי נר = לב פחות.</p>','יאללה, מדליקים!',newGame);
hud();houses();
</script>
</body>
</html>
