const p={map:()=>pn(`<b>מפה</b><svg viewBox='0 0 300 200' style='width:100%;margin-top:6px'><rect width='300' height='200' rx='10' fill='#6fae5a'/><g data-z='forest'><rect x='15' y='70' width='80' height='60' rx='8' fill='#2f6b3a'/><text x='55' y='105' fill='#fff' font-size='13' text-anchor='middle'>🌲 יער הארזים</text></g><g data-z='quarry'><rect x='205' y='70' width='80' height='60' rx='8' fill='#8d8d8d'/><text x='245' y='105' fill='#fff' font-size='13' text-anchor='middle'>🪨 מחצבה</text></g><g data-z='mine'><rect x='110' y='8' width='80' height='45' rx='8' fill='#b8902a'/><text x='150' y='36' fill='#fff' font-size='13' text-anchor='middle'>🟡 מכרה זהב</text></g><g data-z='hill'><rect x='205' y='8' width='80' height='45' rx='8' fill='#9a5a2a'/><text x='245' y='36' fill='#fff' font-size='13' text-anchor='middle'>🟤 הר נחושת</text></g><g data-z='site'><rect x='110' y='80' width='80' height='60' rx='8' fill='#d8c9a0'/><text x='150' y='115' fill='#333' font-size='13' text-anchor='middle'>🕍 אתר הבנייה</text></g></svg><p style='font-size:13px'>לחצו על מקום כדי ללכת אליו.</p>`),
craft:()=>pn(`<b>הכנת חומרים</b><div class='row'><span>בול ארז ← 2 קורות</span><button data-a='beam' ${inv.log<1?'disabled':''}>הכן</button></div><div class='row'><span>2 אבנים גולמיות ← אבן מסותתת</span><button data-a='cut' ${inv.raw<2?'disabled':''}>הכן</button></div><div class='row'><span>2 עפרות ← לוח זהב</span><button data-a='gold' ${inv.ore<2?'disabled':''}>הכן</button></div><div class='row'><span>2 עפרות נחושת ← לוח נחושת</span><button data-a='bronze' ${inv.cu<2?'disabled':''}>הכן</button></div>`),
sage:()=>pn(`<b>👴 שמעון החכם</b><p>${ans}</p><button data-q='0'>מה עכשיו?</button><button data-q='1'>איפה משיגים?</button><button data-q='2'>איך מכינים?</button><button data-q='3'>מה נשאר?</button><div class='row'><input id='qi' placeholder='שאלו את החכם...' style='flex:1;padding:8px;border-radius:10px;border:1px solid #e9b949;background:#2a251c;color:#f6ecd2'><button data-a='ask'>שלח</button></div>`),
view:()=>pn(`<b>מבטים על המקדש</b><div style='margin-top:8px'><button data-v='f'>חזית</button><button data-v='b'>אחור</button><button data-v='l'>צד שמאל</button><button data-v='r'>צד ימין</button><button data-v='a'>מלמעלה</button></div>`),
build:()=>pn(`<b>בנייה</b>`+S.map((s,i)=>`<div class='row'><span>${i<st?'✅':i==st?'👉':'⬜'} ${s[0]}: ${Object.keys(s[1]).map(k=>L[k]+' '+s[1][k]).join(', ')}</span>${i==st&&!done?`<button data-a='build' ${missing()?'disabled':''}>בנו</button>`:''}</div>`).join(''))};
(p[open]||(()=>pn('')))()}
$('#pn').onclick=e=>{const z=e.target.closest('[data-z]'),a=e.target.closest('[data-a]'),b=e.target.closest('[data-q]');if(z)go(z.dataset.z);const w=e.target.closest('[data-v]');if(w){fv=[{f:[0,22,74],b:[0,22,-64],l:[-76,20,3],r:[76,20,3],a:[0,90,45]}[w.dataset.v],[0,3,3]];open='';render()}if(b){ans=q[+b.dataset.q]();render()}if(a){const k=a.dataset.a;if(k=='build')doBuild();else if(k=='again')location.reload();else if(k=='ask'){ans=reply($('#qi').value);render()}else craft(k)}};
$('#bar').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;open=open==b.dataset.k?'':b.dataset.k;render()};
let fv=null,tm=.25,day=1,night=false;
function gat(o){o.visible=false;inv[o.userData.res]++;toast('+1 '+L[o.userData.res]);hud();setTimeout(()=>o.visible=true,7000)}
const K={};addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;K[e.code]=1;if(e.code=='KeyE'){const n=G.filter(o=>o.visible&&o.position.distanceTo(pl.position)<6).sort((a,b)=>a.position.distanceTo(pl.position)-b.position.distanceTo(pl.position))[0];if(n)gat(n)}});addEventListener('keyup',e=>{delete K[e.code]});
(function loop(){requestAnimationFrame(loop);const mx=(K.KeyD?1:0)-(K.KeyA?1:0),mz=(K.KeyS?1:0)-(K.KeyW?1:0);if(mx||mz){fv=null;const n=Math.hypot(mx,mz);pl.position.x=Math.max(-110,Math.min(110,pl.position.x+mx/n*.35));pl.position.z=Math.max(-110,Math.min(110,pl.position.z+mz/n*.35));pl.rotation.y=Math.atan2(mx,mz)}if(fv){tp.set(...fv[0]);tl.set(...fv[1])}else if(done&&!mx&&!mz){ang+=.004;tp.set(Math.sin(ang)*46,16,3+Math.cos(ang)*46);tl.set(0,3,3)}else{tp.set(pl.position.x,11,pl.position.z+17);tl.set(pl.position.x,2,pl.position.z)}
tm=(tm+.00006)%1;const sa=tm*6.283,sd=Math.sin(sa);day=Math.max(0,Math.min(1,(sd+.5)*2.5));night=day<.12;dl.position.set(Math.cos(sa)*40,Math.max(sd,.15)*40+5,15);dl.intensity=.15+.75*day;amb.intensity=.2+.5*day;const sk=new THREE.Color(0x0b1330).lerp(new THREE.Color(0x9fd6f5),day);sc.background=sk;sc.fog.color=sk;$('#dn').textContent=night?'🌙':day>.6?'☀️':'🌇';
for(const p of P){const u=p.userData,t=u.t;if(night)t.copy(u.h);const d=t.clone().sub(p.position);if(d.length()<.3){if(night){p.rotation.x=-1.5;p.position.y=.3}else{p.rotation.x=0;p.position.y=0;t.set(u.c.x+(Math.random()*2-1)*u.r[0],0,u.c.z+(Math.random()*2-1)*u.r[1])}}else{p.rotation.x=0;p.position.y=0;d.normalize();p.position.addScaledVector(d,.06);p.rotation.y=Math.atan2(d.x,d.z)}}cam.position.lerp(tp,.06);cl.lerp(tl,.06);cam.lookAt(cl);for(const m of grow)if(m.scale.y<1)m.scale.y=Math.min(1,m.scale.y+.04);R.render(sc,cam)})();
hud();
